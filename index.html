<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom: test version</title>
<meta name="description" content="Bloom: calm learning, picture talk and play for children. Android test version.">
<meta property="og:title" content="Bloom">
<meta property="og:description" content="Calm learning, picture talk and play for children.">
<meta property="og:image" content="https://violettancl.github.io/bloom-beta/previews/banner.webp">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #FBF7F0; --card: #FFFFFF; --ink: #24453A; --soft: #55706A; --line: #E8DFCE; --forest: #2F6B55; --sun: #F6C453; --lilac: #EDE5FA; --on: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121A17; --card: #1B2622; --ink: #E5EFEA; --soft: #A8BEB4; --line: #2C3B35; --forest: #8FD0B2; --lilac: #231F33; --on: #10201A; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  .hero { background: linear-gradient(180deg, var(--lilac), var(--bg)); padding: 18px 0 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 56px; height: 56px; border-radius: 16px; }
  .brand b { font-size: 1.7rem; color: var(--forest); letter-spacing: .5px; }
  nav { display: flex; gap: 6px; }
  nav button { font: inherit; font-weight: 700; font-size: .95rem; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; min-height: 44px; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--forest); color: var(--on); border-color: var(--forest); }
  .banner { width: 100%; height: auto; display: block; border-radius: 24px; margin: 16px 0 0; box-shadow: 0 10px 30px rgba(60, 40, 110, .15); }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 18px 0 6px; }
  .lead { margin: 0; color: var(--soft); }
  .get { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; background: var(--card); border-radius: 24px; padding: 18px; margin: 18px 0 0; border: 1.5px solid var(--line); }
  .btns { display: grid; gap: 10px; }
  .dl { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--forest); color: var(--on); text-decoration: none; font-weight: 800; font-size: 1.1rem; padding: 14px 18px; border-radius: 16px; min-height: 56px; text-align: center; }
  .dl.alt { background: transparent; color: var(--forest); border: 2px solid var(--forest); font-size: 1rem; min-height: 48px; }
  .meta { margin: 2px 0 0; color: var(--soft); font-size: .88rem; }
  .qr { text-align: center; }
  .qr img { width: 160px; height: 160px; border-radius: 18px; background: #fff; }
  .qr a { display: inline-block; margin-top: 4px; font-size: .88rem; color: var(--forest); font-weight: 700; }
  h2 { font-size: 1.2rem; margin: 30px 0 10px; }
  .shots { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; }
  .shots img { flex: none; width: min(62vw, 250px); height: auto; aspect-ratio: 9 / 16; border-radius: 22px; scroll-snap-align: start; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); background: var(--lilac); }
  .feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; padding: 0; margin: 0; list-style: none; }
  .feat li { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  details { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-top: 14px; }
  summary { font-weight: 800; cursor: pointer; min-height: 32px; }
  details ol { margin: 10px 0 0; padding-inline-start: 1.3em; display: grid; gap: 6px; }
  footer { color: var(--soft); font-size: .88rem; padding: 26px 0 40px; }
  a { color: var(--forest); }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  @media (max-width: 600px) { .get { grid-template-columns: 1fr; } .qr { order: -1; } h1 { font-size: 1.35rem; } }
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="top">
    <div class="brand"><img src="icon.png" alt=""><b>Bloom</b></div>
    <nav aria-label="Language">
      <button type="button" data-l="en">English</button>
      <button type="button" data-l="ar">العربية</button>
      <button type="button" data-l="fr">Français</button>
    </nav>
  </div>
  <img class="banner" src="previews/banner.webp" width="1024" height="500" alt="Bloom">
  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="get">
    <div class="btns">
      <a class="dl" href="https://github.com/ViolettaNcl/bloom-beta/releases/download/preview/Bloom-preview.apk">⬇ <span data-t="dl"></span></a>
      <p class="meta" data-t="meta"></p>
      <a class="dl alt" href="https://github.com/ViolettaNcl/bloom-beta/releases/download/preview/Bloom-full.apk" data-t="full"></a>
    </div>
    <div class="qr"><img src="qr.png" alt="QR" width="160" height="160"><br><a href="bloom-qr-card.png" download data-t="card"></a></div>
  </div>
</div></div>

<main class="wrap">
  <h2 data-t="look"></h2>
  <div class="shots">
    <img src="previews/preview_01.webp" width="540" height="960" alt="" loading="lazy">
    <img src="previews/preview_02.webp" width="540" height="960" alt="" loading="lazy">
    <img src="previews/preview_03.webp" width="540" height="960" alt="" loading="lazy">
    <img src="previews/preview_04.webp" width="540" height="960" alt="" loading="lazy">
    <img src="previews/preview_05.webp" width="540" height="960" alt="" loading="lazy">
    <img src="previews/preview_06.webp" width="540" height="960" alt="" loading="lazy">
  </div>
  <ul class="feat">
    <li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li><li data-t="f4"></li>
  </ul>
  <details>
    <summary data-t="howh"></summary>
    <ol><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ol>
  </details>
  <footer data-t="foot"></footer>
</main>

<script>
const T = {
  en: { title: "Bloom: test version", h1: "Calm learning and play for children", lead: "Puzzles in 24 magic worlds, picture talk and a calm day plan. No ads, works offline.",
    dl: "Download for Android", meta: "Android 8 or later · about 340 MB", full: "Full version (also for tablets and emulators) · 412 MB", card: "Save the QR card",
    look: "A look inside", f1: "🌸 120 puzzles that grow step by step", f2: "🗣️ Talk with pictures and Bloom's voice", f3: "🗓️ My day: first, then, stories", f4: "🌙 Calm: no timers, no punishment",
    howh: "How to install", s1: "Open this page on an Android phone and tap Download.", s2: "Open the file. If asked, allow your browser to install apps.", s3: "If Play Protect warns you, tap More details → Install anyway. This is a test version.",
    foot: "Test version. New versions install over the old one from this same page and keep your progress." },
  ar: { title: "بلوم: نسخة تجريبية", h1: "تعلّم ولعب بهدوء للأطفال", lead: "ألغاز في ٢٤ عالمًا ساحرًا، وتواصل بالصور، وخطة يوم هادئة. بلا إعلانات ويعمل دون إنترنت.",
    dl: "تنزيل لأندرويد", meta: "أندرويد ٨ أو أحدث · نحو ٣٤٠ ميغابايت", full: "النسخة الكاملة (للأجهزة اللوحية والمحاكيات أيضًا) · ٤١٢ ميغابايت", card: "احفظ بطاقة الرمز",
    look: "نظرة من الداخل", f1: "🌸 ١٢٠ لغزًا تزداد صعوبتها خطوة بخطوة", f2: "🗣️ تواصل بالصور وصوت بلوم", f3: "🗓️ يومي: أولًا، ثم، وقصص", f4: "🌙 هادئ: بلا مؤقتات وبلا عقاب",
    howh: "طريقة التثبيت", s1: "افتح هذه الصفحة على هاتف أندرويد واضغط تنزيل.", s2: "افتح الملف. إذا طُلب منك، اسمح للمتصفح بتثبيت التطبيقات.", s3: "إذا ظهر تحذير من Play Protect، اضغط مزيد من التفاصيل ← التثبيت على أي حال. هذه نسخة تجريبية.",
    foot: "نسخة تجريبية. تُثبَّت النسخ الجديدة فوق القديمة من هذه الصفحة نفسها ويبقى التقدّم محفوظًا." },
  fr: { title: "Bloom : version test", h1: "Apprendre et jouer en douceur", lead: "Des énigmes dans 24 mondes magiques, la parole en images et une journée calme. Sans publicité, sans internet.",
    dl: "Télécharger pour Android", meta: "Android 8 ou plus · environ 340 Mo", full: "Version complète (tablettes et émulateurs aussi) · 412 Mo", card: "Enregistrer la carte QR",
    look: "Un aperçu", f1: "🌸 120 énigmes qui progressent pas à pas", f2: "🗣️ Parler avec des images et la voix de Bloom", f3: "🗓️ Ma journée : d'abord, ensuite, histoires", f4: "🌙 Calme : pas de minuteur, pas de punition",
    howh: "Comment installer", s1: "Ouvrez cette page sur un téléphone Android et touchez Télécharger.", s2: "Ouvrez le fichier. Si demandé, autorisez le navigateur à installer des applis.", s3: "Si Play Protect vous avertit, touchez Plus de détails → Installer quand même. C'est une version test.",
    foot: "Version test. Les nouvelles versions s'installent par-dessus depuis cette même page et gardent la progression." },
};
function show(l) {
  const t = T[l];
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; document.title = t.title;
  try { localStorage.setItem("bloom-beta-lang", l); } catch (_) {}
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.l)));
let start = "";
try { start = localStorage.getItem("bloom-beta-lang") || ""; } catch (_) {}
if (!T[start]) { const n = (navigator.language || "en").slice(0, 2); start = T[n] ? n : "en"; }
show(start);
</script>
</body>
</html>
